name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required permissions for the official deploy-pages action set.
# - pages:write to publish
# - id-token:write for OIDC token verification
# - contents:read to checkout the repo
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deploys racing; older queued runs are dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm to >= 11.11.1. Node 22 ships npm 10.x, which has the
      # lockfile cross-arch pruning bug (npm/cli#7961, fixed in 11.3.0)
      # and the over-strict ci validation bug (#8805, fixed in 11.11.1).
      # Without this, npm ci can drop the linux-x64 @rolldown binding
      # the build needs, producing the "Cannot find native binding"
      # error that previously broke PRs #6/#7/#8.
      - name: Pin npm
        run: npm install -g npm@^11.11.1
        shell: bash

      - name: Assert lockfile has linux-x64 rolldown binding
        # Fail fast with a clear message instead of a confusing native
        # binding error 30s into `astro build`. The x64 binding is what
        # ubuntu-latest needs; the arm64 binding is verified separately
        # by the dev box before pushing.
        run: |
          set -euo pipefail
          if ! grep -q '"node_modules/@rolldown/binding-linux-x64-gnu"' package-lock.json; then
            echo "::error::package-lock.json is missing the @rolldown/binding-linux-x64-gnu entry." >&2
            echo "::error::This is the npm cross-arch lockfile pruning bug (npm/cli#7961)." >&2
            echo "::error::Regenerate the lockfile on a host with npm >= 11.3:" >&2
            echo "::error::    rm -rf node_modules package-lock.json && npm install" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        # package.json "build" already runs: astro build && pagefind --site dist
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4